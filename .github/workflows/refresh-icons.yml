name: Refresh Binance icons
on:
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * *'
permissions:
  contents: write
concurrency:
  group: refresh-icons
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install aiohttp==3.14.3 pillow==12.2.0
      - run: python -m unittest test_coin_logo_downloader.py
      - run: python coin_logo_downloader.py
      - name: Publish changed icons and manifest together
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add binance icon_manifest.json icon_sources.json icon_coverage.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Binance spot and futures icon coverage'
            git push
          fi
